version: "3.9"

services:
  dns:
    container_name: dns
    build:
      context: ..
      dockerfile: microservices/dns/Dockerfile
    image: tarunaws/ai:dns
    restart: always
    env_file:
      - ./.env
    networks:
      envid-net:
        ipv4_address: 172.28.0.2

  backend:
    container_name: backend
    build:
      context: ..
      dockerfile: microservices/backend/Dockerfile
    image: tarunaws/ai:backend
    restart: always
    runtime: nvidia
    env_file:
      - ./.env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - ENVID_METADATA_SCENEDETECT_THRESHOLD=12
      - ENVID_SCENE_MIN_SECONDS=0.2
      - ENVID_SCENE_FALLBACK_MIN_SECONDS=3
      - ENVID_SCENE_FALLBACK_TARGET=12
      - ENVID_METADATA_KEY_SCENE_TOP_K=12
      - ENVID_METADATA_KEY_SCENE_MIN_GAP_SECONDS=4
      - ENVID_SUMMARIZER_SERVICE_URL=http://genai:5099
      - ENVID_LLM_MODEL=${ENVID_GENAI_MODEL:-Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf}
      - ENVID_LLM_TRANSCRIPT_MODEL=${ENVID_GENAI_MODEL:-Meta-Llama-3.1-8B-Instruct-Q4_K_M.gguf}
      - ENVID_SYNOPSIS_DEBUG_LOG=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/gcs:/mnt/gcs
      - /mnt/gcs/processing:/tmp
      - /mnt/gcs/envid-local:/tmp/envid-metadata-local
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/home/tarun-envid/gcp.json}:${GOOGLE_APPLICATION_CREDENTIALS:-/home/tarun-envid/gcp.json}:ro
    depends_on:
      - db
      - translate-international
      - translate-indian
    dns:
      - 172.28.0.2
    networks:
      envid-net:
        ipv4_address: 172.28.0.4
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ingest:
    container_name: ingest
    build:
      context: ..
      dockerfile: microservices/ingest/Dockerfile
    image: tarunaws/ai:ingest
    restart: always
    env_file:
      - ./.env
    volumes:
      - /mnt/gcs:/mnt/gcs
    ports:
      - "5090:5090"
    dns:
      - 172.28.0.2
    networks:
      envid-net:
        ipv4_address: 172.28.0.18

  frontend:
    container_name: frontend
    build:
      context: ..
      dockerfile: microservices/frontend/Dockerfile
    image: tarunaws/ai:frontend
    restart: always
    env_file:
      - ./.env
    volumes:
      - /mnt/gcs:/mnt/gcs
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/home/tarun-envid/gcp.json}:${GOOGLE_APPLICATION_CREDENTIALS:-/home/tarun-envid/gcp.json}:ro
    dns:
      - 172.28.0.2
    networks:
      envid-net:
        ipv4_address: 172.28.0.5

  genai:
    container_name: genai
    image: vllm/vllm-openai:latest
    restart: always
    runtime: nvidia
    env_file:
      - ./.env
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_HOME=/root/.cache/huggingface
      - TRANSFORMERS_CACHE=/root/.cache/huggingface
    volumes:
      - /mnt/gcs/hf-cache:/root/.cache/huggingface
    ports:
      - "8000:8000"
    command:
      - ${ENVID_LLM_MODEL}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - ${ENVID_LLM_DTYPE:-float16}
      - --gpu-memory-utilization
      - ${ENVID_LLM_GPU_MEMORY_UTILIZATION:-0.4}
      - --max-model-len
      - ${ENVID_LLM_MAX_MODEL_LEN:-8192}
    networks:
      envid-net:
        ipv4_address: 172.28.0.19
        aliases:
          - genai
    dns:
      - 172.28.0.2

  audio-transcription:
    container_name: audio-transcription
    build:
      context: ..
      dockerfile: microservices/audio-transcription/Dockerfile
    image: tarunaws/ai:audio-transcription
    restart: always
    runtime: ${DOCKER_RUNTIME:-runc}
    env_file:
      - ./.env
    environment:
      - ENVID_WHISPERX_DEVICE=cpu
      - ENVID_WHISPERX_COMPUTE_TYPE=float32
      - ENVID_WHISPERX_MODEL=large-v3
      - ENVID_PUNCTUATION_ENABLED=false
      - HF_HOME=/root/.cache/huggingface
    volumes:
      - /mnt/gcs:/mnt/gcs
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/home/tarun-envid/gcp.json}:${GOOGLE_APPLICATION_CREDENTIALS:-/home/tarun-envid/gcp.json}:ro
      - /mnt/gcs/hf-cache:/root/.cache/huggingface
      - ./audio-transcription/code/openai_whisper_service.py:/app/openai_whisper_service.py:ro
      - ./audio-transcription/code/whisperx_adapter.py:/app/whisperx_adapter.py:ro
      - ./audio-transcription/code/writers.py:/app/writers.py:ro
    ports:
      - "5088:5088"
    networks:
      envid-net:
        ipv4_address: 172.28.0.6
        aliases:
          - audio-transcription
    dns:
      - 172.28.0.2

  moderation:
    container_name: moderation
    build:
      context: ..
      dockerfile: microservices/moderation/Dockerfile
    image: tarunaws/ai:moderation
    restart: always
    runtime: ${DOCKER_RUNTIME:-runc}
    volumes:
      - /mnt/gcs/processing:/tmp
      - /mnt/gcs:/mnt/gcs
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/home/tarun-envid/gcp.json}:${GOOGLE_APPLICATION_CREDENTIALS:-/home/tarun-envid/gcp.json}:ro
    ports:
      - "5081:5081"
    networks:
      envid-net:
        ipv4_address: 172.28.0.7
    dns:
      - 172.28.0.2

  keyscene:
    container_name: keyscene
    build:
      context: ..
      dockerfile: microservices/keyscene/Dockerfile
    image: tarunaws/ai:keyscene
    restart: always
    runtime: ${DOCKER_RUNTIME:-runc}
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - TRANSNETV2_MODEL_DIR=/models/transnetv2-weights
      - TRANSNETV2_BACKEND=pytorch
      - TRANSNETV2_PYTORCH_WEIGHTS=/tmp/transnetv2-pytorch-weights.pth
      - ENVID_METADATA_KEY_SCENE_MIN_GAP_SECONDS=4
    volumes:
      - /mnt/gcs:/mnt/gcs
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/home/tarun-envid/gcp.json}:${GOOGLE_APPLICATION_CREDENTIALS:-/home/tarun-envid/gcp.json}:ro
      - ./keyscene/transnetv2-weights:/models/transnetv2-weights:ro
    ports:
      - "5085:5085"
    networks:
      envid-net:
        ipv4_address: 172.28.0.8
    dns:
      - 172.28.0.2

  transcoder:
    container_name: transcoder
    build:
      context: ..
      dockerfile: microservices/transcoder/Dockerfile
    image: tarunaws/ai:transcoder
    restart: always
    runtime: nvidia
    env_file:
      - ./.env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - ENVID_FFMPEG_LOGLEVEL=verbose
      - ENVID_FFMPEG_LOG_STDERR=true
    volumes:
      - /mnt/gcs:/mnt/gcs
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/home/tarun-envid/gcp.json}:${GOOGLE_APPLICATION_CREDENTIALS:-/home/tarun-envid/gcp.json}:ro
      - ./transcoder/code/ffmpeg.py:/app/ffmpeg.py
    ports:
      - "5091:5091"
    networks:
      envid-net:
        ipv4_address: 172.28.0.9

  scene-detect:
    container_name: scene-detect
    build:
      context: ..
      dockerfile: microservices/scene-detect/Dockerfile
    image: tarunaws/ai:scene-detect
    restart: always
    volumes:
      - /mnt/gcs/processing:/tmp
      - /mnt/gcs:/mnt/gcs
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/home/tarun-envid/gcp.json}:${GOOGLE_APPLICATION_CREDENTIALS:-/home/tarun-envid/gcp.json}:ro
    ports:
      - "5094:5094"
    dns:
      - 172.28.0.2
    networks:
      envid-net:
        ipv4_address: 172.28.0.21


  metadata-export:
    container_name: metadata-export
    build:
      context: ..
      dockerfile: microservices/metadata-export/Dockerfile
    image: tarunaws/ai:metadata-export
    restart: always
    env_file:
      - ./.env
    volumes:
      - /mnt/gcs/processing/tmp:/tmp
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/home/tarun-envid/gcp.json}:${GOOGLE_APPLICATION_CREDENTIALS:-/home/tarun-envid/gcp.json}:ro
    ports:
      - "5096:5096"
    dns:
      - 172.28.0.2
    networks:
      envid-net:
        ipv4_address: 172.28.0.23

  translate-international:
    container_name: translate-international
    image: tarunaws/ai:translate
    restart: always
    env_file:
      - ./.env
    environment:
      - ENVID_LANGUAGETOOL_URL=http://localhost:8010
    volumes:
      - /mnt/gcs/translate/models:/home/libretranslate/.local/share/argos-translate
      - /mnt/gcs/translate/cache:/home/libretranslate/.local/cache
      - /mnt/gcs:/mnt/gcs
      - ./translate/code/supervisord.international.conf:/etc/supervisor/supervisord.conf:ro
    ports:
      - "5000:5000"
      - "8010:8010"
      - "5098:5098"
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 6G
        reservations:
          cpus: '1.0'
          memory: 2G
    dns:
      - 172.28.0.2
    networks:
      envid-net:
        ipv4_address: 172.28.0.14
        aliases:
          - translate-international
          - translate
          - translategrammer

  translate-indian:
    container_name: translate-indian
    build:
      context: ..
      dockerfile: microservices/translate/Dockerfile
    image: tarunaws/ai:translate
    restart: always
    env_file:
      - ./.env
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - HUGGINGFACE_HUB_TOKEN=${HF_TOKEN}
      - INDIC_TRANS_CACHE_DIR=/tmp/indictrans-cache
      - HF_HOME=/tmp/indictrans-cache
      - HF_HUB_CACHE=/tmp/indictrans-cache
      - TRANSFORMERS_CACHE=/tmp/indictrans-cache
      - TMPDIR=/mnt/gcs/translate/tmp
      - TEMP=/mnt/gcs/translate/tmp
      - TMP=/mnt/gcs/translate/tmp
      - TORCHINDUCTOR_CACHE_DIR=/mnt/gcs/translate/torchinductor
      - INDIC_TRANS_BATCH_SIZE=8
      - INDIC_TRANS_MAX_CONCURRENT=1
      - INDIC_TRANS_MEMORY_LIMIT_PCT=85.0
      - INDIC_TRANS_TIMEOUT_SECONDS=300
    volumes:
      - /mnt/gcs/translate/cache:/home/libretranslate/.local/cache
      - /mnt/gcs:/mnt/gcs
      - ./translate/code/supervisord.indian.conf:/etc/supervisor/supervisord.conf:ro
    ports:
      - "5102:5102"
    tmpfs:
      - /tmp
    mem_limit: 4g
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 4G
    dns:
      - 172.28.0.2
    networks:
      envid-net:
        ipv4_address: 172.28.0.26
        aliases:
          - translate-indian

  text-on-video:
    container_name: text-on-video
    build:
      context: ..
      dockerfile: microservices/text-on-video/Dockerfile
    image: tarunaws/ai:text-on-video
    restart: always
    runtime: ${DOCKER_RUNTIME:-runc}
    env_file:
      - ./.env
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - ENVID_METADATA_OCR_ENGINE=tesseract
      - ENVID_METADATA_OCR_MIN_CONF=0.35
      - ENVID_METADATA_OCR_ENABLE_TOP_THIRD=true
      - ENVID_METADATA_OCR_ENABLE_MIDDLE_BAND=true
      - ENVID_METADATA_OCR_ENABLE_LOWER_THIRD=true
      - ENVID_METADATA_OCR_MIDDLE_BAND_HEIGHT=1.0
      - ENVID_METADATA_OCR_DEDUPE_WINDOW_SECONDS=0.75
    volumes:
      - /mnt/gcs/processing:/tmp
      - /mnt/gcs:/mnt/gcs
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/home/tarun-envid/gcp.json}:${GOOGLE_APPLICATION_CREDENTIALS:-/home/tarun-envid/gcp.json}:ro
    ports:
      - "5083:5083"
    dns:
      - 172.28.0.2
    networks:
      envid-net:
        ipv4_address: 172.28.0.17
        aliases:
          - textonvideo


  db:
    container_name: db
    build:
      context: ..
      dockerfile: microservices/db/Dockerfile
    image: tarunaws/ai:db
    restart: always
    volumes:
      - /mnt/processing/mongo:/data/db
    ports:
      - "27017:27017"
    networks:
      envid-net:
        ipv4_address: 172.28.0.24
    dns:
      - 172.28.0.2

  mongo-express:
    container_name: mongo-express
    image: mongo-express:1.0.2-20
    restart: always
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://db:27017
      ME_CONFIG_MONGODB_SERVER: db
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_SITE_BASEURL: /db
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: pass
    depends_on:
      - db
    networks:
      envid-net:
        ipv4_address: 172.28.0.25
    dns:
      - 172.28.0.2

  reverseproxy:
    container_name: reverseproxy
    build:
      context: ..
      dockerfile: microservices/reverseproxy/Dockerfile
    image: tarunaws/ai:reverseproxy
    restart: always
    depends_on:
      - frontend
      - backend
      - mongo-express
    ports:
      - "80:80"
    volumes:
      - /mnt/gcs:/mnt/gcs
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/home/tarun-envid/gcp.json}:${GOOGLE_APPLICATION_CREDENTIALS:-/home/tarun-envid/gcp.json}:ro
    networks:
      envid-net:
        ipv4_address: 172.28.0.13
        aliases:
          - reverproxy
    dns:
      - 172.28.0.2

networks:
  envid-net:
    name: envid-net
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24

volumes: {}
